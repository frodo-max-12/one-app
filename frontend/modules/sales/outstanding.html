<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE App — Outstanding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="./css/outstanding.css" />
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <span class="page-title">Outstanding / Receivables</span>
        <div class="topbar-actions">
          <span id="roleTag" class="role-tag"></span>
          <div class="chip">
            <span class="chip-dot" style="background: var(--green);"></span>
            <span>API Connected</span>
          </div>
        </div>
      </div>
      <div class="content">
        <div class="grid-4" id="summaryCards"></div>
        <div class="card">
          <div class="section-head">
            <h2>Receivables</h2>
            <button id="refreshBtn" class="btn btn-ghost btn-sm">Refresh</button>
          </div>
          <div class="filters-row">
            <div class="input-wrap search-flex">
              <span class="input-icon">⌕</span>
              <input id="searchInput" class="search-input" placeholder="Search customer, invoice…" />
            </div>
            <div class="filter-tabs" id="agingTabs">
              <div class="filter-tab active" data-aging="all">All</div>
              <div class="filter-tab" data-aging="overdue">Overdue</div>
              <div class="filter-tab" data-aging="0-30">0–30d</div>
              <div class="filter-tab" data-aging="31-60">31–60d</div>
              <div class="filter-tab" data-aging="61-90">61–90d</div>
              <div class="filter-tab" data-aging="90+">90+d</div>
            </div>
          </div>
          <div id="outstandingLoading" class="loading-center"><div class="spinner"></div></div>
          <div class="table-wrap">
            <table id="outstandingTable" style="display:none;">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Invoice / Ext. Doc</th>
                  <th>Salesperson</th>
                  <th>Posting Date</th>
                  <th>Due Date</th>
                  <th style="text-align:right;">Invoice Amt</th>
                  <th style="text-align:right;">Outstanding</th>
                  <th>Aging</th>
                  <th style="text-align:center;">Reminder</th>
                </tr>
              </thead>
              <tbody id="outstandingBody"></tbody>
            </table>
          </div>
          <div id="outstandingEmpty" class="empty" style="display:none;">
            <div class="empty-icon">✓</div>
            <div class="empty-text">No outstanding entries found</div>
          </div>
          <div class="pagination" id="pagination"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/shared/modules.js"></script>
  <script src="/shared/common.js"></script>
  <script src="/shared/mobile-menu.js"></script>
  <script src="./js/outstanding.js"></script>
</body>
</html>
