<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE App Lens — Reports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="./css/reports.css?v=1" />
</head>
<body class="lens-body">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <span class="page-title">ONE App Lens · Reports</span>
        <div class="topbar-actions">
          <span id="roleTag" class="role-tag"></span>
        </div>
      </div>

      <div class="content lens-scroll">
        <div class="reports-wrap">

          <!-- ───────── LEFT: report picker ───────── -->
          <aside class="reports-left">
            <input type="search" id="repSearch" placeholder="Search reports…" oninput="filterReports()" />
            <div class="reports-list" id="reportsList">
              <div class="rep-empty">Loading…</div>
            </div>
          </aside>

          <!-- ───────── RIGHT: filter + preview ───────── -->
          <section class="reports-right">
            <div class="rep-head" id="repHead">
              <h2 id="repName">Select a report</h2>
              <p id="repDesc" class="rep-desc">Pick a report from the left.</p>
            </div>

            <div class="rep-controls" id="repControls" style="display:none;">
              <div class="rep-filters" id="repFilters"></div>
              <div class="rep-actions">
                <button type="button" class="btn btn-primary"  onclick="runReport('json')">▶ Preview</button>
                <button type="button" class="btn btn-success"  onclick="runReport('xlsx')">⇩ Excel</button>
                <button type="button" class="btn btn-accent"   onclick="runReport('pdf')">⇩ PDF</button>
                <button type="button" class="btn btn-success" id="repMatrixBtn" style="display:none;" onclick="downloadMatrix()" title="Monthly per-employee grid (days as columns: IN/OUT/Work Hrs/Visits/Status) — like the Matrix machine register. Uses the month of the 'From' date.">⇩ Matrix (month grid)</button>
                <span class="rep-status" id="repStatus"></span>
              </div>
            </div>

            <div class="rep-preview-wrap">
              <div class="rep-preview-info" id="repInfo"></div>
              <div class="rep-preview" id="repPreview">
                <div class="rep-empty">No preview yet. Pick a report and press Preview.</div>
              </div>
            </div>
          </section>

        </div>
      </div>
    </div>
  </div>

  <script src="/shared/modules.js?v=5"></script>
  <script src="/shared/common.js?v=5"></script>
  <script src="/shared/mobile-menu.js?v=3"></script>
  <script src="./js/reports.js?v=1"></script>
</body>
</html>
