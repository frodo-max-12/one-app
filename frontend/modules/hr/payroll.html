<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE App Lens — Payroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="./css/payroll.css?v=1" />
</head>
<body class="lens-body">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <span class="page-title">ONE App Lens · Payroll</span>
        <div class="topbar-actions">
          <span id="roleTag" class="role-tag"></span>
          <button class="btn btn-primary" type="button" onclick="openCreateRun()">+ New Payroll Run</button>
        </div>
      </div>

      <div class="content lens-scroll">
        <div class="pr-wrap">

          <div class="pr-head">
            <h2>Payroll Runs</h2>
            <label class="pr-year">
              <span>FY Year</span>
              <select id="yearSel" onchange="loadRuns()"></select>
            </label>
          </div>

          <div id="runsList" class="pr-runs">
            <div class="pr-empty">Loading…</div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- ════════ NEW RUN MODAL ════════ -->
  <div class="lens-modal" id="newRunModal" hidden>
    <div class="lens-modal-card">
      <div class="lens-modal-head">
        <button class="lens-modal-back" type="button" onclick="closeCreateRun()">←</button>
        <span>New Payroll Run</span>
      </div>
      <label class="pr-field">
        <span>Pay Period (Month)</span>
        <select id="nrMonth"></select>
      </label>
      <p class="pr-meta">Creates a <b>draft</b> run. You'll then click <b>Process</b> to compute payslips from active employee salaries + approved LOP leaves overlapping this month.</p>
      <button class="btn btn-primary btn-wide" type="button" onclick="submitCreateRun()">Create Draft Run</button>
      <div class="pr-err" id="nrErr" style="display:none;"></div>
    </div>
  </div>

  <script src="/shared/modules.js?v=10"></script>
  <script src="/shared/common.js?v=10"></script>
  <script src="/shared/mobile-menu.js?v=3"></script>
  <script src="./js/payroll.js?v=1"></script>
</body>
</html>
