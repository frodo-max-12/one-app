<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE App Lens — My Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="./css/home.css?v=3" />
  <link rel="stylesheet" href="./css/attendance.css?v=1" />
</head>
<body class="lens-body">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <span class="page-title">ONE App Lens · My Attendance</span>
        <div class="topbar-actions">
          <select id="daysFilter" class="att-filter">
            <option value="1">Today</option>
            <option value="7" selected>Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30">Last 30 days</option>
          </select>
        </div>
      </div>

      <div class="content lens-scroll">
        <div class="lens-home">

          <div class="att-summary" id="attSummary">
            <div class="sum-pill"><span class="lbl">Sessions</span><span class="val" id="sumSessions">—</span></div>
            <div class="sum-pill"><span class="lbl">Total Hours</span><span class="val" id="sumHours">—</span></div>
            <div class="sum-pill"><span class="lbl">Avg / Day</span><span class="val" id="sumAvg">—</span></div>
          </div>

          <div id="attList" class="att-list">
            <div class="holiday-skel" style="height:140px;margin-bottom:10px;"></div>
            <div class="holiday-skel" style="height:140px;margin-bottom:10px;"></div>
          </div>

          <section class="lens-diag" id="lensDiag" style="display:none;">
            <h3>⚠ Diagnostics</h3>
            <ul id="diagList"></ul>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Selfie lightbox -->
  <div class="lens-modal" id="selfieLightbox" hidden onclick="closeLightbox()">
    <img id="lightboxImg" alt="Selfie" class="lightbox-img" />
  </div>

  <script src="/shared/modules.js?v=3"></script>
  <script src="/shared/common.js?v=3"></script>
  <script src="/shared/mobile-menu.js?v=3"></script>
  <script src="/shared/lens-tracker.js?v=1"></script>
  <script src="./js/attendance.js?v=1"></script>
</body>
</html>
