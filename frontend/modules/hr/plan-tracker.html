<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE App Lens — Visit Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
  <link rel="stylesheet" href="./css/home.css?v=3" />
  <link rel="stylesheet" href="./css/journey.css?v=2" />
  <link rel="stylesheet" href="./css/plan-tracker.css?v=1" />
</head>
<body class="lens-body">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <div class="main">
      <div class="topbar">
        <span class="page-title">ONE App Lens · Visit Tracker</span>
        <div class="topbar-actions">
          <div class="emp-picker-wrap" id="empPickerWrap" style="display:none;">
            <label class="emp-picker-label" for="userPicker">👤 Employee</label>
            <select id="userPicker" class="emp-picker"></select>
          </div>
          <input type="date" id="dateFilter" class="att-filter" />
        </div>
      </div>

      <div class="content lens-scroll">
        <div class="pt-shell">

          <!-- Day summary banner -->
          <div class="pt-banner">
            <div class="pt-greet">
              <div class="pt-greet-name" id="ptName">—</div>
              <div class="pt-greet-date" id="ptDate">—</div>
            </div>
            <div class="pt-score">
              <div class="pt-score-num" id="ptCompletionPct">—</div>
              <div class="pt-score-lbl">Completion</div>
            </div>
          </div>

          <!-- KPI strip -->
          <div class="pt-kpi">
            <div class="pt-tile pt-planned">
              <div class="pt-tile-num" id="kpiPlanned">0</div>
              <div class="pt-tile-lbl">Planned</div>
            </div>
            <div class="pt-tile pt-done">
              <div class="pt-tile-num" id="kpiDone">0</div>
              <div class="pt-tile-lbl">Completed</div>
            </div>
            <div class="pt-tile pt-missed">
              <div class="pt-tile-num" id="kpiMissed">0</div>
              <div class="pt-tile-lbl">Missed</div>
            </div>
            <div class="pt-tile pt-adhoc">
              <div class="pt-tile-num" id="kpiAdHoc">0</div>
              <div class="pt-tile-lbl">Ad-hoc</div>
            </div>
            <div class="pt-tile pt-time">
              <div class="pt-tile-num" id="kpiTime">0h</div>
              <div class="pt-tile-lbl">Customer Time</div>
            </div>
          </div>

          <!-- Two-column: visits list + map -->
          <div class="pt-grid">
            <div class="pt-list-col">
              <div class="pt-section-head">
                <h2>Today's Visits</h2>
                <span class="lens-sub" id="ptListCount">—</span>
              </div>
              <div id="ptVisitList" class="pt-visit-list">
                <div class="holiday-skel" style="height:100px;margin-bottom:10px;"></div>
                <div class="holiday-skel" style="height:100px;margin-bottom:10px;"></div>
                <div class="holiday-skel" style="height:100px;"></div>
              </div>
            </div>
            <div class="pt-map-col">
              <div id="ptMap" class="journey-map"></div>
              <div class="pt-legend">
                <span><span class="ld dot-done"></span> Completed</span>
                <span><span class="ld dot-missed"></span> Missed</span>
                <span><span class="ld dot-adhoc"></span> Ad-hoc</span>
                <span><span class="ld dot-route"></span> Actual route</span>
              </div>
            </div>
          </div>

          <section class="lens-diag" id="lensDiag" style="display:none;">
            <h3>⚠ Diagnostics</h3>
            <ul id="diagList"></ul>
          </section>

        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="/shared/modules.js?v=3"></script>
  <script src="/shared/common.js?v=3"></script>
  <script src="/shared/mobile-menu.js?v=3"></script>
  <script src="/shared/lens-tracker.js?v=1"></script>
  <script src="./js/plan-tracker.js?v=2"></script>
</body>
</html>
