<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONE App — Login</title>

  <!--
    Auto-redirect on app open (v1.8 — 2026-06-03).
    If a JWT is already cached in localStorage from a previous Remember-Me
    login, skip the login form and go straight to the user's landing page.
    Runs synchronously before <body> renders so the form never flashes.

    Escape hatch: open `/index.html?logout=1` or `/index.html?force=login` to
    force the login form (used by the Logout button and "switch user" flows).
  -->
  <script>
    (function () {
      try {
        var q = location.search.toLowerCase();
        if (q.indexOf('logout') !== -1 || q.indexOf('force=login') !== -1) return;

        var token = localStorage.getItem('nav_token') || sessionStorage.getItem('nav_token');
        var rawUser = localStorage.getItem('nav_user') || sessionStorage.getItem('nav_user');
        if (!token || !rawUser) return;

        var user;
        try { user = JSON.parse(rawUser); } catch (_) { return; }
        if (!user || !user.role) return;

        var role = (user.role || '').toLowerCase().trim();

        // HR, ANY FAE role, and the ENTIRE Product team (head + assistant) → Lens
        // Home. Matched by word so all Product + FAE skip the company picker and the
        // Sales/AR dashboard they can't use. DC File stays reachable from a home tile.
        if (role === 'hr' || role === 'hr head' || /\bfae\b/.test(role) || /\bproduct\b/.test(role)) {
          if (!sessionStorage.getItem('nav_company')) sessionStorage.setItem('nav_company', 'COMPANYA');
          location.replace('/modules/hr/home.html');
          return;
        }

        // Warehouse user (Singapore, CompanyB-only) → Warehouse home + COMPANYB company.
        if (role === 'warehouse') {
          sessionStorage.setItem('nav_company', 'COMPANYB');
          location.replace('/modules/warehouse/home.html');
          return;
        }

        // Store electrical (a colleague — Retailer scanner), Retailer auditors + delivery driver
        // → Store home + COMPANYA company. Bypasses the Sales dashboard they can't access
        // (would otherwise show "Failed to load dashboard" on login).
        if (role === 'store electrical' || role === 'retailer auditor' || role === 'retailer delivery') {
          if (!sessionStorage.getItem('nav_company')) sessionStorage.setItem('nav_company', 'COMPANYA');
          location.replace('/modules/store/home.html');
          return;
        }

        // Sales / heads / admin / etc.
        if (sessionStorage.getItem('nav_company')) {
          // Company already picked this session → straight to dashboard.
          location.replace('/modules/sales/dashboard.html');
        } else {
          // Need to pick COMPANYA or CompanyB first. Still saves typing email+password.
          location.replace('/select-company.html');
        }
      } catch (e) {
        /* anything weird → fall through to login form */
      }
    })();
  </script>

  <!-- PWA — installable on Android (Add to Home Screen) and iOS (Safari Share → Add to Home Screen) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0c1a2b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ONE App" />
  <link rel="apple-touch-icon" href="/images/app-icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/images/app-icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/common.css" />
  <link rel="stylesheet" href="/shared/login.css" />
  <link rel="stylesheet" href="/shared/responsive.css" />
</head>
<body>
  <div class="login-page">
    <div class="login-card fade-up">
      <div class="login-logo">
        <div class="logo-icon">1</div>
        <h1>ONE App</h1>
        <p>One platform · Sales · CSR · HR · Purchase · Account · Store · FAE · Product</p>
      </div>

      <div class="vpn-notice">
        <span>⚠</span>
        <span>Use your email address as username</span>
      </div>

      <div id="loginError" class="login-error" style="display:none;"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input id="username" class="form-input" placeholder="Enter your email address" required />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" class="form-input" placeholder="Enter password" required />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="form-check">
          <input id="rememberMe" type="checkbox" checked />
          <span>Keep me signed in (30 days) — uncheck on a shared device</span>
        </label>

        <button id="loginBtn" class="login-btn" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <script src="/shared/modules.js"></script>
  <script src="/shared/common.js"></script>
  <script src="/shared/login.js"></script>
</body>
</html>
